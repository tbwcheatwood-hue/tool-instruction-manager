<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' https: http: data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https: http:"
    />
    <title>Game Overlay</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="guide glass" id="guide" data-hit>
      <header class="guide-head">
        <span class="live-dot" title="Active"></span>
        <span class="module-name">Strategy Guides</span>
        <input class="search" id="guide-search" type="search" placeholder="Search" aria-label="Search guide" />
        <button class="icon-btn" id="guide-min" type="button" aria-label="Minimize guide">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8h10"/></svg>
        </button>
      </header>
      <div class="reader" id="reader">
        <input class="guide-title" id="guide-title" type="text" aria-label="Guide heading" />
        <ul class="check-list" id="checks"></ul>
        <div id="notes"></div>
        <div class="add-row">
          <button class="text-btn" id="add-check" type="button">Add item</button>
          <button class="text-btn" id="add-note" type="button">Add note</button>
        </div>
      </div>
      <footer class="panel-foot">
        <span class="cue">Guide scroll • Alt+Up/Down</span>
        <span class="cue">Saved per game <span class="profile-name" id="profile-guide"></span></span>
      </footer>
    </section>

    <section class="browser glass" id="browser" data-hit>
      <nav class="tabs" id="tabs" aria-label="Tabs"></nav>
      <div class="browser-main">
        <form class="urlbar" id="urlbar">
          <input class="url-input" id="url-input" type="text" spellcheck="false" placeholder="Search or enter address" aria-label="Address" />
        </form>
        <div class="url-line"></div>
        <div class="wv-frame" id="wv-frame"></div>
        <footer class="browser-foot">
          <span class="cue">Active • Shift+Tab</span>
          <button class="cue-btn" id="click-through" type="button" aria-pressed="false">Click-through</button>
        </footer>
      </div>
    </section>

    <section class="player glass" id="player" data-hit>
      <button class="art-btn" id="art-btn" type="button" aria-label="Album art">
        <img class="art" id="art" alt="" />
      </button>
      <div class="track">
        <div class="track-title" id="track-title">YouTube Music</div>
        <div class="track-by" id="track-by">Not playing</div>
      </div>
      <button class="icon-btn" id="play" type="button" aria-label="Play">
        <svg id="play-icon" width="18" height="18" viewBox="0 0 18 18" fill="currentColor"><path d="M6 4.2v9.6l8-4.8-8-4.8z"/></svg>
      </button>
      <button class="icon-btn" id="next" type="button" aria-label="Next">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor"><path d="M4 4.5v9l6.2-4.5L4 4.5zM13 4.5h1.6v9H13z"/></svg>
      </button>
      <input class="volume" id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume" />
      <button class="icon-btn" id="queue-toggle" type="button" aria-label="Queue" aria-expanded="false">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6l4 4 4-4"/></svg>
      </button>
      <button class="icon-btn" id="music-min" type="button" aria-label="Minimize player">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8h10"/></svg>
      </button>
    </section>
    <section class="queue glass" id="queue" data-hit hidden></section>

    <aside class="dock dock-left" id="dock-left" data-hit hidden>
      <div class="dock-title" id="dock-guide-title"></div>
      <div class="dock-sub" id="dock-check"></div>
      <div class="dock-row">
        <button class="icon-btn" id="dock-play-left" type="button" data-action="play" aria-label="Play"></button>
        <span class="cue">Guide scroll • Alt+Up/Down</span>
      </div>
      <div class="dock-cues">
        <span class="cue">Saved per game</span>
        <span class="profile-name" id="profile-dock"></span>
      </div>
    </aside>

    <aside class="dock dock-right" id="dock-right" data-hit hidden>
      <div class="dock-row">
        <button class="icon-btn" id="dock-play-right" type="button" data-action="play" aria-label="Play"></button>
        <div class="track" data-action="play">
          <div class="track-title" id="dock-track">YouTube Music</div>
        </div>
      </div>
      <div class="dock-row">
        <div class="mini-tabs" id="dock-tabs"></div>
      </div>
      <div class="dock-cues">
        <span class="cue">Active • Shift+Tab</span>
        <button class="cue-btn" id="click-through-dock" type="button" data-action="click" aria-pressed="false">Click-through</button>
      </div>
    </aside>

    <webview id="music-guest" partition="persist:overlay"></webview>
    <script src="app.js"></script>
  </body>
</html>
